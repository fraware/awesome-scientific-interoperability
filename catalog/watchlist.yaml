items:
- id: agent2agent-a2a-protocol
  name: Agent2Agent (A2A) Protocol
  url: https://a2a-protocol.org/v1.0.0/
  candidate_section: Agents, Access, and Policy
  status: monitor
  reason: Potential inclusion when scientific multi-agent systems adopt it substantively.
  missing_evidence:
  - Published scientific multi-agent pilots or production deployments beyond general agent tooling.
  - Documented interoperability contracts with laboratory or workflow systems in this corpus.
  reviewed_on: '2026-08-01'
  review_due_on: '2027-08-01'
  promotion_conditions:
  - At least two independent scientific deployments with documented cross-system agent handoffs.
  - Clear boundary against MCP-only tooling entries already in the main list.
  rejection_conditions:
  - Remains a general agent protocol without substantive scientific adoption evidence.
  - Superseded by a finalized IEEE or domain standard with stronger governance.
  source_refs:
  - ref_id: a2a-protocol-org-v1-0-0
    role: technical-definition
- id: cromwell
  name: Cromwell
  url: https://cromwell.readthedocs.io/
  candidate_section: Workflows and Execution
  status: needs-boundary-decision
  reason: Potentially redirect to WDL or select as a reference implementation after comparison.
  missing_evidence:
  - A precise decision on whether WDL or Cromwell is the stronger representative for workflow execution.
  - Documented cross-backend interoperability claims distinct from WDL already listed.
  reviewed_on: '2026-08-01'
  review_due_on: '2027-08-01'
  promotion_conditions:
  - Boundary analysis shows Cromwell adds distinct interoperability value beyond WDL.
  - Selected as a Reference Architecture with explicit comparison to Nextflow and Snakemake.
  rejection_conditions:
  - WDL remains the canonical workflow-language entry and Cromwell adds no new mechanism.
  - Better represented through an existing main-list workflow resource.
  source_refs:
  - ref_id: cromwell-readthedocs-io-root
    role: technical-definition
