theme: bioimaging-astronomy
candidates:
- id: ome-data-model-and-ome-tiff
  name: OME Data Model and OME-TIFF
  official_url: https://ome-model.readthedocs.io/en/latest/
  candidate_section: Data and Digital Objects
  coverage_family: bioimaging-data-exchange
  priority: P1
  disposition: boundary-review
  mechanism: OME-XML metadata model embedded in TIFF or exchanged separately for multidimensional biological
    imaging.
  why_distinct: Mature installed-base format for bioimaging exchange, complementary to cloud-native OME-NGFF.
  primary_sources:
  - https://ome-model.readthedocs.io/en/latest/
  - https://ome-model.readthedocs.io/en/latest/ome-tiff/specification.html
  - https://github.com/ome/ome-model
  evidence_notes: Broad Bio-Formats and OMERO ecosystem; decide whether OME-NGFF alone is sufficient at main-list
    granularity.
  next_step: Compare installed-base decision value against OME-NGFF before admission.
- id: ivoa-simple-application-messaging-protocol-samp
  name: IVOA Simple Application Messaging Protocol (SAMP)
  official_url: https://www.ivoa.net/documents/SAMP/
  candidate_section: Workflows and Execution
  coverage_family: astronomy-application-messaging
  priority: P1
  disposition: boundary-review
  mechanism: Messaging protocol for desktop and browser astronomy applications to discover one another and
    exchange data and commands.
  why_distinct: A rare mature scientific application-interoperability protocol with many independent tools.
  primary_sources:
  - https://www.ivoa.net/documents/SAMP/
  - https://www.ivoa.net/
  - https://github.com/ivoa-std/SAMP
  evidence_notes: Stable IVOA Recommendation; requires role-sensitive astronomy family policy.
  next_step: Admit with TAP/VOTable batch only if each astronomy entry has a non-overlapping role.
- id: ivoa-observation-core-obscore
  name: IVOA Observation Core (ObsCore/ObsTAP)
  official_url: https://ivoa.net/documents/ObsCore/
  candidate_section: Metadata and Semantics
  coverage_family: astronomy-observation-discovery
  priority: P1
  disposition: boundary-review
  mechanism: Core observation metadata model implemented through TAP to support uniform discovery across astronomy
    archives.
  why_distinct: Combines a scientific observation data model with a deployed federated query interface.
  primary_sources:
  - https://ivoa.net/documents/ObsCore/
  - https://ivoa.net/documents/TAP/
  evidence_notes: Stable IVOA Recommendation; may be represented through the TAP entry and decision guide instead
    of a separate main item.
  next_step: Decide separate entry versus typed profile relationship under TAP.
- id: advanced-scientific-data-format-asdf
  name: Advanced Scientific Data Format (ASDF)
  official_url: https://asdf-standard.readthedocs.io/en/latest/
  candidate_section: Data and Digital Objects
  coverage_family: astronomy-data-exchange
  priority: P1
  disposition: boundary-review
  mechanism: Self-describing YAML and binary-block format with schemas, extensions, references, and versioned
    scientific data models.
  why_distinct: Modern astronomy-oriented alternative to FITS for complex hierarchical scientific data.
  primary_sources:
  - https://asdf-standard.readthedocs.io/en/latest/
  - https://github.com/asdf-format/asdf-standard
  - https://github.com/asdf-format/pyasdf
  evidence_notes: Maintained specification and implementations; adoption narrower than FITS.
  next_step: Evaluate independent archive and mission adoption before admission.
