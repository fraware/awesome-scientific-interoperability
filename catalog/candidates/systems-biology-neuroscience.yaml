theme: systems-biology-neuroscience
candidates:
- id: openminds
  name: openMINDS
  official_url: https://openminds.ebrains.eu/
  candidate_section: Metadata and Semantics
  coverage_family: neuroscience-metadata-knowledge-graph
  priority: P2
  disposition: rejected-represented-by
  represented_by_resource_ids:
  - brain-imaging-data-structure-bids
  - neurodata-without-borders-nwb
  mechanism: Schema and controlled-term ecosystem for interoperable neuroscience metadata and knowledge
    graphs.
  why_distinct: Potential complement to BIDS and NWB at the semantic metadata layer.
  primary_sources:
  - https://openminds.ebrains.eu/
  - https://github.com/HumanBrainProject/openMINDS
  evidence_notes: openMINDS is a substantial EBRAINS metadata ecosystem, but BIDS and NWB already provide
    the neuroimaging and neurophysiology exchange decisions for this corpus. Broader independent reuse
    outside originating infrastructure is insufficient for a third neuroscience metadata main-list entry.
  next_step: Closed as represented by brain-imaging-data-structure-bids and neurodata-without-borders-nwb;
    reopen only with independent multi-operator deployments and an approved metadata-layer guide.
- id: nifti
  name: NIfTI
  official_url: https://nifti.nimh.nih.gov/
  candidate_section: Data and Digital Objects
  coverage_family: neuroimaging-file-exchange
  priority: P2
  disposition: rejected-represented-by
  mechanism: Binary image and header format for volumetric neuroimaging data.
  why_distinct: Underlying file exchange for many BIDS datasets, though BIDS may provide stronger North-Star
    decision value.
  primary_sources:
  - https://nifti.nimh.nih.gov/
  - https://github.com/NIFTI-Imaging/nifti_clib
  evidence_notes: NIfTI remains a widely used neuroimaging file format, but BIDS already provides the
    stronger organization and metadata interoperability decision for this corpus.
  next_step: Closed as represented by brain-imaging-data-structure-bids; reopen only if a raw format comparison
    guide is required independent of BIDS.
  represented_by_resource_ids:
  - brain-imaging-data-structure-bids
