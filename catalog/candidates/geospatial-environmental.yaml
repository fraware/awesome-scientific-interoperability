theme: geospatial-environmental
candidates:
- id: ogc-geopackage
  name: OGC GeoPackage
  official_url: https://www.geopackage.org/
  candidate_section: Data and Digital Objects
  coverage_family: geospatial-data-exchange
  priority: P1
  disposition: watchlist
  current_repository_state: watchlist
  review_due_on: '2027-02-02'
  mechanism: SQLite-based standard for portable vector features, tile matrices, attributes, extensions,
    and metadata.
  why_distinct: Adds an offline and embedded geospatial exchange contract complementary to OGC APIs and
    STAC.
  primary_sources:
  - https://www.geopackage.org/
  - https://www.ogc.org/standard/geopackage/
  - https://github.com/opengeospatial/geopackage
  evidence_notes: GeoPackage is a mature OGC portable geospatial package, but the catalog already admits OGC
    API Features, OGC API Coverages, and STAC. Further OGC file-package entries require an explicit family
    budget rather than piecemeal admission.
  next_step: Monitor under catalog/watchlist.yaml; promote only after an OGC exchange-family policy budgets
    a portable file-package role distinct from API and STAC discovery surfaces.
- id: geoparquet
  name: GeoParquet
  official_url: https://geoparquet.org/
  candidate_section: Data and Digital Objects
  coverage_family: cloud-geospatial-data-exchange
  priority: P1
  disposition: rejected-out-of-scope
  mechanism: Open metadata and encoding specification for storing geospatial vector data in Apache Parquet.
  why_distinct: Adds cloud-analytics geospatial interoperability not provided by feature-service APIs.
  primary_sources:
  - https://geoparquet.org/
  - https://github.com/opengeospatial/geoparquet
  evidence_notes: GeoParquet is a promising cloud-native geospatial encoding, but governance maturity and
    OGC-family concentration relative to already admitted OGC APIs and STAC do not justify main-list admission.
    Bare Parquet remains a generic substrate outside scope.
  next_step: Closed as out of scope for the current corpus; reopen only if GeoPackage or an approved
    cloud-geospatial package role is admitted and GeoParquet still offers a distinct decision.
- id: ogc-sensorml
  name: OGC SensorML
  official_url: https://www.ogc.org/standard/sensorml/
  candidate_section: Metadata and Semantics
  coverage_family: sensor-description
  priority: P1
  disposition: rejected-represented-by
  mechanism: Model and encodings for describing sensors, processes, observation procedures, positions,
    inputs, outputs, and capabilities.
  why_distinct: Complements SensorThings and SOSA/SSN with executable process and system descriptions.
  primary_sources:
  - https://www.ogc.org/standard/sensorml/
  - https://schemas.opengis.net/sensorML/
  evidence_notes: SensorML describes sensor systems and processes, but SensorThings and SOSA/SSN already
    cover operational sensor exchange and observation semantics for this corpus.
  next_step: Closed as represented by ogc-sensorthings-api and sosa-ssn; reopen only for a sensor process-description
    decision guide.
  represented_by_resource_ids:
  - ogc-sensorthings-api
  - sosa-ssn
- id: ogc-waterml-2
  name: OGC WaterML 2.0
  official_url: https://www.ogc.org/standard/waterml/
  candidate_section: Data and Digital Objects
  coverage_family: hydrology-observation-exchange
  priority: P1
  disposition: rejected-out-of-scope
  mechanism: GML-based standard for exchanging hydrological time series, monitoring points, procedures,
    and observation metadata.
  why_distinct: Adds a mature hydrology domain exemplar for observational data exchange.
  primary_sources:
  - https://www.ogc.org/standard/waterml/
  - https://schemas.opengis.net/waterml/2.0/
  evidence_notes: WaterML 2.0 is a mature hydrology observation encoding, but the corpus already exemplifies
    observational exchange through SensorThings/SOSA and does not need every domain time-series profile
    as a main-list entry.
  next_step: Closed as a domain niche beyond current observational coverage; reopen only with an approved
    hydrology exemplar slot.
- id: ogc-api-records
  name: OGC API - Records
  official_url: https://ogcapi.ogc.org/records/
  candidate_section: Identifiers and Discovery
  coverage_family: geospatial-record-discovery
  priority: P2
  disposition: rejected-represented-by
  mechanism: Web API for searching, filtering, and retrieving metadata records and collections.
  why_distinct: Potential modern replacement or complement to catalog discovery patterns in geospatial
    systems.
  primary_sources:
  - https://ogcapi.ogc.org/records/
  - https://github.com/opengeospatial/ogcapi-records
  evidence_notes: OGC API Records overlaps catalog/discovery roles already represented by STAC and DCAT.
    Maturity does not justify a third discovery surface in the same family.
  next_step: Closed as represented by spatiotemporal-asset-catalog-stac and w3c-data-catalog-vocabulary-dcat.
  represented_by_resource_ids:
  - spatiotemporal-asset-catalog-stac
  - w3c-data-catalog-vocabulary-dcat
- id: ogc-api-environmental-data-retrieval
  name: OGC API - Environmental Data Retrieval (EDR)
  official_url: https://ogcapi.ogc.org/edr/
  candidate_section: Workflows and Execution
  coverage_family: environmental-data-access
  priority: P2
  disposition: rejected-represented-by
  mechanism: Web API for querying environmental data by position, area, trajectory, corridor, cube, and
    temporal constraints.
  why_distinct: Provides domain-specific spatiotemporal retrieval patterns beyond generic Features and
    Coverages APIs.
  primary_sources:
  - https://ogcapi.ogc.org/edr/
  - https://github.com/opengeospatial/ogcapi-environmental-data-retrieval
  evidence_notes: EDR adds spatiotemporal retrieval patterns, but Coverages and Features already exemplify
    OGC API data access for this list. Additional OGC API products require an explicit family budget.
  next_step: Closed as represented by ogc-api-coverages and ogc-api-features; reopen only after an OGC
    API family review budgets another access role.
  represented_by_resource_ids:
  - ogc-api-coverages
  - ogc-api-features
- id: geosciml
  name: GeoSciML
  official_url: https://geosciml.org/
  candidate_section: Metadata and Semantics
  coverage_family: geoscience-data-exchange
  priority: P2
  disposition: rejected-out-of-scope
  mechanism: Conceptual model and encodings for geological units, structures, timescales, boreholes, and
    geologic observations.
  why_distinct: Potential geoscience semantic exemplar beyond generic geospatial APIs.
  primary_sources:
  - https://geosciml.org/
  - https://schemas.opengis.net/gsml/
  evidence_notes: GeoSciML is a geoscience semantic model with survey adoption, but it does not yet clear
    the exceptional-quality and decision-value bar relative to broader geospatial APIs already admitted.
  next_step: Closed as out of scope for the current corpus; reopen only with stronger public interoperability
    evidence and an approved geoscience exemplar slot.
