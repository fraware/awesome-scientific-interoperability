name: Apply Batch G patch

on:
  pull_request:
    paths:
      - '.github/workflows/batch-g-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-44-batch-g-astronomy-bioimaging-boundaries
          fetch-depth: 0
      - name: Verify and apply Batch G patch
        shell: bash
        run: |
          set -euo pipefail
          cat .batch-g.patch.part* > /tmp/batch-g.patch.gz.b64
          test "$(wc -c < /tmp/batch-g.patch.gz.b64)" -eq 32904
          base64 --decode /tmp/batch-g.patch.gz.b64 > /tmp/batch-g.patch.gz
          echo "740d93fd42d58eabd69f63ffb1939424cfb75eb1c13c4c3c06ee5b065471c588  /tmp/batch-g.patch.gz" | sha256sum --check -
          gzip -dc /tmp/batch-g.patch.gz > /tmp/batch-g.patch
          git apply --check /tmp/batch-g.patch
          git apply /tmp/batch-g.patch
          rm -f .batch-g.patch.part* .github/workflows/batch-g-source-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add astronomy and bioimaging boundary standards"
          git push origin HEAD:agent/issue-44-batch-g-astronomy-bioimaging-boundaries
