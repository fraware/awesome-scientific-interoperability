name: Expansion candidate quality

on:
  pull_request:
    paths:
      - 'catalog/expansion-candidates.yaml'
      - 'catalog/candidates/**'
      - 'schema/expansion-candidates.schema.json'
      - 'scripts/validate_expansion_candidates.py'
      - 'tests/test_expansion_candidates.py'
      - 'docs/candidate-reviews/comprehensive-expansion-2026.md'
      - '.github/workflows/expansion-candidates.yml'
  push:
    branches: [main]
    paths:
      - 'catalog/expansion-candidates.yaml'
      - 'catalog/candidates/**'
      - 'schema/expansion-candidates.schema.json'
      - 'scripts/validate_expansion_candidates.py'
      - 'tests/test_expansion_candidates.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_expansion_candidates.py
      - run: python -m unittest tests.test_expansion_candidates -v
