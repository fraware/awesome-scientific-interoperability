name: Batch A source snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'agent/batch-a-source-snapshot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Package exact source tree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/awesome-scientific-interoperability-main.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: batch-a-source-tree
          path: /tmp/awesome-scientific-interoperability-main.tar.gz
          retention-days: 1
