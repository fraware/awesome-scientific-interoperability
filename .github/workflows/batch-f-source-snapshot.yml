name: Apply Batch F patch

on:
  pull_request:
    paths:
      - '.github/workflows/batch-f-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-44-batch-f-neuroscience-model-exchange
          fetch-depth: 0
      - name: Verify and apply Batch F patch
        shell: bash
        run: |
          set -euo pipefail
          cat .batch-f.patch.part* > /tmp/batch-f.patch.gz.b64
          test "$(wc -c < /tmp/batch-f.patch.gz.b64)" -eq 29680
          base64 --decode /tmp/batch-f.patch.gz.b64 > /tmp/batch-f.patch.gz
          echo "669075c8894e71d291a186d31ae5935560ce940d77b54037937ffd93f2daafb7  /tmp/batch-f.patch.gz" | sha256sum --check -
          gzip -dc /tmp/batch-f.patch.gz > /tmp/batch-f.patch
          git apply --check /tmp/batch-f.patch
          git apply /tmp/batch-f.patch
          rm -f .batch-f.patch.part* .github/workflows/batch-f-source-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add computational neuroscience model exchange batch"
          git push origin HEAD:agent/issue-44-batch-f-neuroscience-model-exchange
