name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_catalog.py
      - run: python scripts/validate_decision_guides.py
      - run: python scripts/validate_problem_index.py
      - run: python scripts/validate_watchlist.py
      - run: python scripts/check_review_freshness.py
      - run: python scripts/audit_data_quality.py --as-of 2026-08-01 --json-report data-quality-audit.json --markdown-report data-quality-audit.md --check-baseline docs/data-quality-baseline.json --fail-on warning
      - run: python scripts/check_links.py --offline --scope all
      - run: python -m unittest discover -s tests -v
      - name: Coverage audit
        run: python scripts/audit_coverage.py --json-report coverage-audit.json --markdown-report coverage-audit.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-audit
          path: |
            coverage-audit.json
            coverage-audit.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-quality-audit
          path: |
            data-quality-audit.json
            data-quality-audit.md
      - run: python scripts/verify_manifest.py

  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npx --yes awesome-lint
