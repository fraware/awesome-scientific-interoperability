name: Apply issue 44 Batch B

on:
  pull_request:
    paths:
      - '.github/workflows/apply-batch-b.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/issue-44-batch-b-astronomy-bioimaging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-44-batch-b-astronomy-bioimaging
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify and apply exact validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat .batch-b/part-* > /tmp/issue-44-batch-b.patch.gz.b64
          echo '41ad48a809802b74b953ccff8f5c7de39d54ad0d041d088c3adcfa4f5f3b17df  /tmp/issue-44-batch-b.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/issue-44-batch-b.patch.gz.b64 > /tmp/issue-44-batch-b.patch.gz
          echo 'ea2bbba92162e2949d2811783b5797a85b6ab1f369d26ce4284f74d43740d6bb  /tmp/issue-44-batch-b.patch.gz' | sha256sum -c -
          gzip --decompress --stdout /tmp/issue-44-batch-b.patch.gz > /tmp/issue-44-batch-b.patch
          echo '1190511e96f823757caa532fc4c6900b9fd0a0bc84d8f10d06dcd82b26ab341a  /tmp/issue-44-batch-b.patch' | sha256sum -c -
          git apply --check /tmp/issue-44-batch-b.patch
          git apply /tmp/issue-44-batch-b.patch
          git rm -r .batch-b .github/workflows/apply-batch-b.yml
          git add -A
          git diff --cached --check
          python scripts/verify_manifest.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement issue 44 Batch B astronomy and bioimaging expansion'
          git push origin HEAD:agent/issue-44-batch-b-astronomy-bioimaging
