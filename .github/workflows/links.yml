name: Links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: >
          python scripts/check_links.py
          --timeout 25
          --workers 10
          --json-report artifacts/link-audit.json
          --markdown-report artifacts/link-audit.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-audit
          path: artifacts/
