name: Apply expansion manifest

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/comprehensive-corpus-expansion' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/comprehensive-corpus-expansion
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Regenerate manifest for final clean tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-expansion-manifest.yml
          python scripts/generate_manifest.py
          git add MANIFEST.json
          git diff --cached --check
          git commit -m "Regenerate manifest for expansion registry"
          git push origin HEAD:agent/comprehensive-corpus-expansion
