name: Apply issue 44 Batch C

on:
  pull_request:
    paths:
      - '.github/workflows/apply-batch-c.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/issue-44-batch-c-genomic-representation-access'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-44-batch-c-genomic-representation-access
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify and apply exact validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat .batch-c/part-* > /tmp/issue-44-batch-c.patch.gz.b64
          echo '3d0e2a6db4640c8a04f166a2e666192011b2aac11f77050c00b84fdff18b3c63  /tmp/issue-44-batch-c.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/issue-44-batch-c.patch.gz.b64 > /tmp/issue-44-batch-c.patch.gz
          echo 'a0e1360b5d9797e3bddaea4719949901c09af7e0cc5b0eada7ce1d12bcf99781  /tmp/issue-44-batch-c.patch.gz' | sha256sum -c -
          gzip --decompress --stdout /tmp/issue-44-batch-c.patch.gz > /tmp/issue-44-batch-c.patch
          echo 'f92624270cf98f5249e48a32b75451459584763a416f4bca84957b14ed5c9804  /tmp/issue-44-batch-c.patch' | sha256sum -c -
          git apply --check /tmp/issue-44-batch-c.patch
          git apply /tmp/issue-44-batch-c.patch
          git rm -r .batch-c .github/workflows/apply-batch-c.yml
          git add -A
          git diff --cached --check
          python scripts/verify_manifest.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement issue 44 Batch C genomic representation and access'
          git push origin HEAD:agent/issue-44-batch-c-genomic-representation-access
