name: One-shot specification manifest repair

on:
  push:
    branches: [docs/final-engineering-takeover-spec]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/final-engineering-takeover-spec
      - name: Refresh manifest and remove this workflow
        run: |
          git rm .github/workflows/spec-manifest-repair.yml
          python scripts/generate_manifest.py
      - name: Commit final specification tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.json
          git commit -m 'Refresh manifest for engineering takeover specification'
          git push origin HEAD:docs/final-engineering-takeover-spec
