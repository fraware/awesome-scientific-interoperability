name: Current full repository snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/data-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Package full tracked repository
        run: |
          git ls-files -z | tar --null -czf current-full-repository.tgz --files-from=-
      - uses: actions/upload-artifact@v4
        with:
          name: current-full-repository
          path: current-full-repository.tgz
          if-no-files-found: error
          retention-days: 1
